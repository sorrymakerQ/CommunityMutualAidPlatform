# ==========================================
# 社区互助平台 配置文件
# ==========================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: linlibang

  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/linlibang?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf-8&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    # 密码通过环境变量 MYSQL_PASSWORD 设置；默认 1234 便于本地开发（生产环境务必用环境变量覆盖）
    password: ${MYSQL_PASSWORD:1234}

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password:
    timeout: 3000ms
    connect-timeout: 3000ms
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        max-wait: 1000ms

  # 文件上传大小限制
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# RocketMQ 配置
rocketmq:
  name-server: localhost:9876
  # 支付超时延迟等级（内置等级表：1s 5s 10s 30s 1m 2m … 15=20m 16=30m 17=1h 18=2h）
  # 16 = 30 分钟（生产值）；本地联调想快速验证"超时自动作废"，临时改成 3（= 10 秒）即可，无需改代码
  pay-timeout:
    delay-level: 16
  producer:
    # 生产组
    group: producer-group
    # 发送超时 3 秒（与业务"MQ 不可用不影响接单"的容错策略匹配）
    send-message-timeout: 3000
    # 生产端重试：同步发送失败自动重试 2 次（共最多 3 次尝试），仍失败抛异常由业务 try-catch 兜底
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2

# MyBatis 配置
mybatis:
  configuration:
    # 数据库字段下划线转驼峰：help_count → helpCount
    map-underscore-to-camel-case: true
  # 实体类所在包，用于类型别名
  type-aliases-package: com.linlibang.entity

# 日志配置
logging:


# Sa-Token 认证配置
sa-token:
  # Token 有效期：7天
  timeout: 604800
  # 临时有效期（用户持续操作自动续期）：3天
  active-timeout: -1
  # 是否允许同一账号多地同时登录
  is-concurrent: true
  # Token 风格：tik
  token-style: tik
  # 从请求头读取 Token 的名称为 satoken
  token-name: satoken
  is-log: true


# ==========================================
# 阿里云 OSS 配置（敏感信息请通过环境变量设置）
# ==========================================
# 环境变量：
#   ALIYUN_OSS_ACCESS_KEY_ID     - 阿里云 AccessKey ID
#   ALIYUN_OSS_ACCESS_KEY_SECRET - 阿里云 AccessKey Secret
#   MYSQL_PASSWORD               - 数据库密码
#   JWT_SECRET                   - JWT 签名密钥
# 请前往 https://oss.console.aliyun.com 创建 Bucket 并获取以下信息
aliyun:
  oss:
    # 地域节点（Endpoint），例如：oss-cn-hangzhou.aliyuncs.com
    endpoint: oss-cn-beijing.aliyuncs.com
    # 阿里云 AccessKey ID（本地开发可在 application-local.yml 配置，生产通过环境变量注入；此处留空）
    access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
    # 阿里云 AccessKey Secret（本地开发可在 application-local.yml 配置，生产通过环境变量注入；此处留空）
    access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
    # Bucket 名称
    bucket-name: linglibang
    # 访问域名（用于拼接完整URL），例如：https://linlibang.oss-cn-hangzhou.aliyuncs.com
    base-url: https://linglibang.oss-cn-beijing.aliyuncs.com
    # 上传文件大小限制（MB）
    max-size: 10




